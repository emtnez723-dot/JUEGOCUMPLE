function pick(c){if(lock||!alive||api.paused||c.classList.contains("up")||c.classList.contains("ok"))return;c.classList.add("up");c.textContent=c.dataset.e;beep(500,.05);sel.push(c);
if(sel.length<2)return;moves++;const[a,b]=sel;sel=[];
if(a.dataset.e==b.dataset.e){a.className=b.className="c ok";found++;beep(900,.1);info();if(found==3+L){total+=found;L++;if(L>10){alive=false;api.end(true,Math.floor(total/3)*2)}else{lock=true;setTimeout(()=>{lock=false;lvl()},800)}}}
else{lock=true;fails++;setTimeout(()=>{[a,b].forEach(z=>{z.className="c";z.textContent="❔"});lock=false;info();if(fails>=max){alive=false;api.end(false,Math.floor((total+found)/3)*2)}},700)}}
lvl();return()=>{alive=false}}
// ---- 3 SNAKE ----
// El crecimiento ya está implementado: al comer una copa no se ejecuta sn.pop(), por lo que la cola gana un segmento.
function snake(st,api){const N=8,HN=9,S=30,W=N*S,Z=HN*S,cv=document.createElement("canvas");cv.width=W;cv.height=Z;cv.style.width="min(100%,38vh)";st.appendChild(cv);const x=cv.getContext("2d");
const C=Math.floor(N/2),CY=Math.floor(HN/2);let sn=[{x:C,y:CY},{x:C-1,y:CY},{x:C-2,y:CY},{x:C-3,y:CY},{x:C-4,y:CY}],pv=sn.slice(),dir={x:1,y:0},nd={x:1,y:0},cups=0,cup,acc=0,tm=0;const lv=()=>Math.min(30,cups+1),spd=()=>Math.max(.07,.22-lv()*.005);
const put=()=>{do cup={x:Math.random()*N|0,y:Math.random()*HN|0};while(sn.some(s=>s.x==cup.x&&s.y==cup.y))};put();
const turn=d=>{const v={U:[0,-1],D:[0,1],L:[-1,0],R:[1,0]}[d];if(v[0]!=-nd.x||v[1]!=-nd.y)nd={x:v[0],y:v[1]}};
const kd=e=>{const m={ArrowUp:"U",ArrowDown:"D",ArrowLeft:"L",ArrowRight:"R"}[e.key];if(m){e.preventDefault();turn(m)}};addEventListener("keydown",kd);
document.querySelectorAll("#pad button").forEach(b=>b.onclick=()=>turn(b.dataset.d));
let sx,sy;cv.ontouchstart=e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY};cv.ontouchend=e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
if(Math.max(Math.abs(dx),Math.abs(dy))>20)turn(Math.abs(dx)>Math.abs(dy)?(dx>0?"R":"L"):(dy>0?"D":"U"))};
const info=()=>api.set(cups*2,`Nivel ${lv()}/30 · 🍷${cups}`);info();
const ln=(a,b,w,c)=>{x.strokeStyle=c;x.lineWidth=w;x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.stroke()};
function draw(t){x.fillStyle="#fff3f8";x.fillRect(0,0,W,Z);for(let i=0;i<N;i++)for(let j=0;j<HN;j++)if((i+j)%2){x.fillStyle="#ff5fa214";x.fillRect(i*S,j*S,S,S)}
const cx=cup.x*S+S/2,cy=cup.y*S+S/2+Math.sin(tm*5)*1.5;
// Copa grande, con halo y fondo para distinguirla incluso entre los segmentos.
x.save();x.shadowColor="#ff267e";x.shadowBlur=22;x.fillStyle="rgba(255,255,255,.92)";x.beginPath();x.arc(cx,cy, S*.48,0,Math.PI*2);x.fill();x.shadowBlur=0;
x.font="30px serif";x.textAlign="center";x.textBaseline="middle";x.fillText("🍷",cx,cy+1);x.restore();
const P=sn.map((s,i)=>{const q=pv[Math.min(i,pv.length-1)];return[(q.x+(s.x-q.x)*t)*S+S/2,(q.y+(s.y-q.y)*t)*S+S/2]}),n=P.length;x.lineCap="round";
const segW=i=>S*(.86-.5*i/n);
for(let i=n-2;i>=0;i--)ln(P[i],P[i+1],segW(i)+4,"#04210f");
for(let i=n-2;i>=0;i--)ln(P[i],P[i+1],segW(i),i%2?"#1f9d3a":"#2fcf4f");
for(let i=n-2;i>=0;i--)ln(P[i],P[i+1],segW(i)*.45,i%2?"#c9e86a":"#e8f59a");
for(let i=1;i<n-1;i+=2){x.fillStyle="#0a4d1e";x.save();x.translate(P[i][0],P[i][1]);x.rotate(Math.PI/4);const w=segW(i)*.22;x.fillRect(-w,-w,w*2,w*2);x.restore()}
const h=P[0],a=Math.atan2(dir.y,dir.x);x.save();x.translate(h[0],h[1]);x.rotate(a);
if(Math.sin(tm*9)>.2){x.strokeStyle="#ff3050";x.lineWidth=3;x.beginPath();x.moveTo(S*.4,0);x.lineTo(S*.85,0);x.moveTo(S*.85,0);x.lineTo(S*1.05,-5);x.moveTo(S*.85,0);x.lineTo(S*1.05,5);x.stroke()}
x.fillStyle="#04210f";x.beginPath();x.ellipse(2,0,S*.62,S*.5,0,0,7);x.fill();x.fillStyle="#2fcf4f";x.beginPath();x.ellipse(2,0,S*.58,S*.45,0,0,7);x.fill();
x.fillStyle="#1f9d3a";x.beginPath();x.ellipse(-4,0,S*.3,S*.3,0,0,7);x.fill();
for(const k of[-1,1]){x.fillStyle="#ffe600";x.beginPath();x.arc(S*.18,k*S*.26,S*.15,0,7);x.fill();x.fillStyle="#000";x.beginPath();x.ellipse(S*.2,k*S*.26,S*.03,S*.12,0,0,7);x.fill();x.fillStyle="#04210f";x.fillRect(S*.52,k*S*.15-1,3,3)}
x.restore()}
const stop=loop(d=>{tm+=d;if(!api.paused){acc+=d;if(acc>=spd()){acc-=spd();dir=nd;const h={x:sn[0].x+dir.x,y:sn[0].y+dir.y};
if(h.x<0||h.y<0||h.x>=N||h.y>=HN||sn.slice(0,-1).some(s=>s.x==h.x&&s.y==h.y)){draw(1);return api.end(false,cups*2)}
pv=sn.slice();sn.unshift(h);if(h.x==cup.x&&h.y==cup.y){cups++;beep(900,.1);info();if(cups>=30){draw(1);return api.end(true,60)}put()}else sn.pop()}}
draw(Math.min(1,acc/spd()))});
return()=>{stop();removeEventListener("keydown",kd)}}
login();
</script></body></html>
